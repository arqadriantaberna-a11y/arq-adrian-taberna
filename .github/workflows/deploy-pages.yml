name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir sitio estático
        run: npm run build

      - name: Publicar la versión editorial aprobada
        run: cat static-site/chunks/index.part-* > out/index.html

      - name: Verificar integridad de la portada
        run: echo "32bcb042c7be97167271803bee04adba64ad5ca14b76c233fb0d83401d940b71  out/index.html" | sha256sum --check

      - name: Incorporar Objetos de diseño
        run: node scripts/inject-objects.mjs

      - name: Enlazar segundo artículo del Newsletter
        run: node scripts/link-second-newsletter.mjs

      - name: Enlazar tercer artículo del Newsletter
        run: node scripts/link-third-newsletter.mjs

      - name: Corregir encabezados de proyectos en móvil
        run: node scripts/fix-mobile-project-headings.mjs

      - name: Incorporar Habitar el Vacío en la portada
        run: node scripts/add-habitar-vacio.mjs

      - name: Descargar imágenes de Habitar el Vacío
        run: |
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/ca115dab-d4f9-4a45-bc8d-ea0931293022-habitar-vacio-assets.zip" -o /tmp/habitar-vacio-assets.zip
          echo "54a1a7db88db69de2648b22327f9e08e3d9f0c12d911b5d0f7195c12b91c77b8  /tmp/habitar-vacio-assets.zip" | sha256sum --check
          unzip -q /tmp/habitar-vacio-assets.zip -d out
          test -f out/images/habitar-vacio/31-maqueta.webp

      - name: Conservar proporciones originales en Habitar el Vacío
        run: node scripts/preserve-habitar-vacio-image-ratios.mjs

      - name: Retirar dos imágenes inconsistentes de Habitar el Vacío
        run: node scripts/remove-habitar-vacio-outliers.mjs

      - name: Descargar nueva documentación de Habitar el Umbral
        run: |
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/00c61884-01ca-423d-9308-80141b05b61d-habitar-umbral-nuevo-assets.zip" -o /tmp/habitar-umbral-assets.zip
          echo "c09dbb30e1a8af75766afd6ae4304f315a2cdf54ba559a15ab8525ec0b39ac9f  /tmp/habitar-umbral-assets.zip" | sha256sum --check
          rm -rf out/proyectos/habitar-el-umbral
          unzip -q /tmp/habitar-umbral-assets.zip -d out
          test -f out/images/habitar-umbral-new/umbral-50.webp

      - name: Reemplazar Habitar el Umbral por la nueva versión
        run: node scripts/replace-habitar-umbral.mjs

      - name: Descargar documentación renovada de Casa Patio
        run: |
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/51a35f61-7e57-40f7-9e52-8a77b1226d1e-casa-patio-renovado-assets.zip" -o /tmp/casa-patio-assets.zip
          echo "a88c647c63793ac704d146bddd54e25f7f7b0f05cf45d643269358d4a7d37944  /tmp/casa-patio-assets.zip" | sha256sum --check
          unzip -q /tmp/casa-patio-assets.zip -d out
          test -f out/images/casa-patio-new/casa-35.jpeg
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/a9d34183-8876-4593-8942-2497a8d3230a-casa-patio-maqueta-nueva.png" -o out/images/casa-patio-new/maqueta-nueva.png
          echo "fb6c546b6e87a88a4401e70495ea0250b05abf245094970ebb3537a04d694387  out/images/casa-patio-new/maqueta-nueva.png" | sha256sum --check

      - name: Reemplazar Casa Patio por la nueva versión
        run: node scripts/replace-casa-patio.mjs

      - name: Descargar documentación renovada de Torre Residencial
        run: |
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/7b823acc-32ab-43c6-b180-c353a35d2926-torre-residencial-renovada-assets-a.zip" -o /tmp/torre-residencial-a.zip
          echo "c418ab48cc56bb2376e69703f90eef7a3099b3f390d6f758a0285f44c606b1bc  /tmp/torre-residencial-a.zip" | sha256sum --check
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/ecf09c83-df07-47c8-9b9c-eb54bf5caa7e-torre-residencial-renovada-assets-b.zip" -o /tmp/torre-residencial-b.zip
          echo "53370daf63d5d1aafc124f23a88dad19b399d24da198f74c173a459360e1b468  /tmp/torre-residencial-b.zip" | sha256sum --check
          unzip -q /tmp/torre-residencial-a.zip -d out
          unzip -q /tmp/torre-residencial-b.zip -d out
          test -f out/images/torre-residencial-new/torre-01.webp
          test -f out/images/torre-residencial-new/torre-41.webp

      - name: Reemplazar Torre Residencial por la nueva versión
        run: node scripts/replace-torre-residencial.mjs

      - name: Descargar documentación renovada de Centro Ambulatorio
        run: |
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/c4a0227f-cd46-41bc-bb74-09a7e0498058-centro-ambulatorio-renovado-assets.zip" -o /tmp/centro-ambulatorio-assets.zip
          echo "ff1163aaa384d82d3b9f23f4f2e2c6299e9726d3923c1282fc37d96940483789  /tmp/centro-ambulatorio-assets.zip" | sha256sum --check
          unzip -q /tmp/centro-ambulatorio-assets.zip -d out
          test -f out/images/centro-ambulatorio-new/centro-14.jpeg
          test -f out/images/centro-ambulatorio-new/centro-48.jpeg

      - name: Reemplazar Centro Ambulatorio por la nueva versión
        run: node scripts/replace-centro-ambulatorio.mjs

      - name: Descargar las 48 páginas y el PDF de CALIGO N.º 001
        run: |
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/87c01fe8-1412-4fe0-b79a-71a3c652bd5a-caligo-n001-pages.zip" -o /tmp/caligo-pages.zip
          echo "a779cdfa85f3e63e8caadc486c8ac15122cc17031992e4f7a58525e81f2ed1a0  /tmp/caligo-pages.zip" | sha256sum --check
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/e0742c78-8e92-4cb0-81f5-a8e1e203a2a4-caligo-n001-pdf.zip" -o /tmp/caligo-pdf.zip
          echo "917e0179e2ff25a48e4261205b2c26dedfbe561e730f68700397d2abfd1e18e9  /tmp/caligo-pdf.zip" | sha256sum --check
          unzip -q /tmp/caligo-pages.zip -d out
          unzip -q /tmp/caligo-pdf.zip -d out
          test -f out/images/caligo/n001/p01.webp
          test -f out/images/caligo/n001/p48.webp
          test -f out/revista/caligo/n001/CALIGO_N001_web.pdf

      - name: Publicar revista CALIGO y su lector independiente
        run: |
          mkdir -p out/revista/caligo/n001
          cp static-site/caligo-reader.html out/revista/caligo/n001/index.html
          node scripts/add-caligo.mjs

      - name: Descargar las 48 páginas y el PDF de CALIGO N.º 002
        run: |
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/d459859c-3ff1-4d1a-8a9d-b70f49c7b95f-caligo-n002-pages.zip" -o /tmp/caligo-n002-pages.zip
          echo "535efed210e76bb232645fc8796ae78c800e50ced492674c9787faee4fe41019  /tmp/caligo-n002-pages.zip" | sha256sum --check
          curl -fL --retry 3 "https://adrian-360.floot.app/_cdn/static/f9abe17e-8025-48ed-86d6-ad8c89f307ff-caligo-n002-pdf.zip" -o /tmp/caligo-n002-pdf.zip
          echo "6543f990fd22a80c8daf0d7bb72fc353b882dc0235b27ab9353550d254637238  /tmp/caligo-n002-pdf.zip" | sha256sum --check
          unzip -q /tmp/caligo-n002-pages.zip -d out
          unzip -q /tmp/caligo-n002-pdf.zip -d out
          test -f out/images/caligo/n002/p01.webp
          test -f out/images/caligo/n002/p48.webp
          test -f out/revista/caligo/n002/CALIGO_N002_web.pdf

      - name: Publicar CALIGO N.º 002 y conservar archivo del N.º 001
        run: node scripts/add-caligo-n002.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
